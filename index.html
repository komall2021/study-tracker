<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Study Tracker • Focus & Flow</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
  :root {
    --bg: #0b0f17;
    --bg-2: radial-gradient(1200px 800px at 80% -10%, #1c2340 0%, transparent 40%),
            radial-gradient(900px 600px at -10% 20%, #162b3b 0%, transparent 45%),
            radial-gradient(1000px 600px at 50% 110%, #1e1430 0%, transparent 50%),
            #0b0f17;
    --card: rgba(23, 28, 45, 0.76);
    --border: rgba(255, 255, 255, 0.06);
    --text: #f5f7fb;
    --muted: #9db1c8;

    --primary: #7bd6ff;
    --primary-2: #a98bff;

    --good: #86efac;
    --warn: #fbbf24;
    --danger: #fb7185;

    --ring-bg: rgba(255,255,255,0.06);
    --accent: #7bd6ff;

    --shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
    --radius: 18px;

    --logo-grad: linear-gradient(135deg, #7bd6ff, #a98bff);
  }
  :root[data-theme="light"]{
    --bg: #f7f9fc;
    --bg-2: radial-gradient(1200px 800px at 80% -10%, #e8f0ff 0%, transparent 40%),
            radial-gradient(900px 600px at -10% 20%, #eaf7ff 0%, transparent 45%),
            #f7f9fc;
    --card: rgba(255,255,255,0.9);
    --border: rgba(10, 30, 50, 0.08);
    --text: #0f172a;
    --muted: #4b5563;

    --ring-bg: rgba(15,23,42,0.07);
    --shadow: 0 10px 28px rgba(15,23,42,0.08), inset 0 1px 0 rgba(255,255,255,0.5);

    --primary: #2563eb;
    --primary-2: #7c3aed;
    --accent: #2563eb;

    --logo-grad: linear-gradient(135deg, #60a5fa, #a78bfa);
  }

  :root[data-theme="pride"]{
    --bg: #0a0b0f;
    --bg-2:
      radial-gradient(1200px 700px at 90% -10%, rgba(239,68,68,.35) 0%, transparent 45%),
      radial-gradient(900px 500px at -10% 10%, rgba(249,115,22,.30) 0%, transparent 45%),
      radial-gradient(1000px 600px at 40% 110%, rgba(59,130,246,.30) 0%, transparent 50%),
      radial-gradient(850px 650px at 10% 90%, rgba(168,85,247,.28) 0%, transparent 50%),
      #0a0b0f;
    --card: rgba(18, 20, 35, 0.78);
    --border: rgba(255,255,255,0.12);
    --text: #ffffff;
    --muted: #cbd5e1;

    --ring-bg: rgba(255,255,255,0.12);
    --shadow: 0 10px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);

    --primary: #ef4444;
    --primary-2: #8b5cf6;
    --accent: #ff7ab6;

    --logo-grad: linear-gradient(90deg,
      #ef4444, #f97316, #f59e0b, #22c55e, #3b82f6, #8b5cf6);
  }

  * { box-sizing: border-box }
  html, body { height: 100% }
  body{
    margin:0;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    color: var(--text);
    background: var(--bg-2);
    background-attachment: fixed;
    letter-spacing: 0.2px;
  }

  :root[data-theme="pride"] .card{ border-image: linear-gradient(90deg,#ef4444,#f97316,#f59e0b,#22c55e,#3b82f6,#8b5cf6) 1; }
  :root[data-theme="pride"] .chip, :root[data-theme="pride"] .badge{ border-image: linear-gradient(90deg,#ef4444,#f59e0b,#22c55e,#3b82f6,#8b5cf6) 1; }

  .site { max-width: 1100px; margin: 28px auto; padding: 0 20px 40px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 18px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:38px; height:38px; border-radius:12px; background: var(--logo-grad); display:grid; place-items:center; color:#0b1020; font-weight:900; box-shadow: 0 8px 20px rgba(121, 209, 255, 0.25); }
  .brand h1 { font-size: 22px; margin:0; }
  .brand p { margin:0; color:var(--muted); font-size:13px }
  .actions { display:flex; gap:10px; align-items:center }
  .grid { display:grid; gap:18px; grid-template-columns: 1.1fr 1fr; }
  @media (max-width: 960px){ .grid { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; backdrop-filter: blur(8px); }
  .section-title{ margin: 0 0 8px 0; font-weight: 700; letter-spacing: 0.3px; }
  .divider{ height:1px; background: var(--border); margin: 12px 0 16px; }

  label { font-size: 12px; color: var(--muted); margin-bottom:6px; display:block }
  input { width:100%; border:1px solid var(--border); background: rgba(0,0,0,0.25); color: var(--text); border-radius: 12px; padding: 12px 14px; outline: none; transition: border-color .15s ease, transform .04s ease; }
  :root[data-theme="light"] input { background: rgba(255,255,255,0.8) }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(119,207,255,0.16) }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap: 12px }
  .row-3 { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px }
  @media (max-width: 560px){ .row, .row-3 { grid-template-columns: 1fr } }
  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center }
  button{ appearance:none; border:1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); font-weight: 700; letter-spacing: .2px; padding: 10px 14px; border-radius: 12px; cursor:pointer; transition: transform .04s ease, filter .15s ease, background .15s ease; }
  button:hover{ transform: translateY(-1px); filter: brightness(1.05) }
  .btn-primary{ background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #0b1020; border: none; }
  .btn-danger{ background: #2a0f15; border-color:#471e26; color:#ffd9df }
  .btn-warn  { background: #211a0b; border-color:#3b2d10; color:#fde7b0 }
  .btn-ghost { background: rgba(255,255,255,0.03) }
  .toggle{ border-radius: 999px; padding: 8px 12px; font-weight:700; background: rgba(255,255,255,0.06); }

  .meta{ display:flex; gap:10px; flex-wrap:wrap; align-items:center }
  .badge{ display:flex; align-items:center; gap:8px; background: rgba(255,255,255,0.04); border:1px solid var(--border); border-radius: 999px; padding: 8px 12px; font-weight: 700; color: var(--text); }

  .ring-wrap{ display:grid; place-items:center }
  .ring{ --size: 160px; width: var(--size); height: var(--size); border-radius: 50%; background: conic-gradient(var(--accent) 0deg 0deg, var(--ring-bg) 0deg 360deg); display:grid; place-items:center; position: relative; box-shadow: inset 0 0 0 8px rgba(0,0,0,0.15), 0 16px 30px rgba(0,0,0,0.25); }
  .ring:after{ content:""; position:absolute; inset:10px; border-radius:50%; background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,0.12), transparent 50%), linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.12)); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05); }
  .ring .inner{ position:absolute; inset:18px; border-radius:50%; display:grid; place-items:center; }
  .ring .value{ font-weight: 900; font-size: 26px }
  .ring .cap{ font-size: 12px; color: var(--muted) }

  table{ width:100%; border-collapse: collapse; font-size: 13.5px }
  th, td{ padding: 10px 10px; border-bottom:1px dashed var(--border); }
  th{ text-align:left; color: var(--muted); font-weight:800; letter-spacing:.2px }
  tbody tr:hover { background: rgba(255,255,255,0.03) }
  .right{ text-align:right }
  .empty{ color: var(--muted); text-align:center; padding: 14px 0 }

  .toast{ border-left:4px solid var(--good); background: rgba(0, 255, 160, 0.08); padding: 12px 14px; border-radius: 12px; display:none; }

  .big-timer{ display:grid; place-items:center; margin: 10px 0 6px; }
  .clock{ --size: 240px; width: var(--size); height: var(--size); position: relative; border-radius:50%;
    background: radial-gradient(140% 120% at 25% 20%, rgba(255,255,255,0.08), transparent 55%),
                linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.18));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), 0 18px 36px rgba(0,0,0,0.30);
  }
  .clock svg{ position:absolute; inset:0; transform: rotate(-90deg); }
  .clock .center{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; }
  .clock .time{ font-weight:900; font-size: 34px; letter-spacing: 1px; }
  .clock .cap{ font-size: 12px; color: var(--muted); margin-top: 4px; }
  .clock.running{ box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), 0 18px 36px rgba(0,0,0,0.30), 0 0 32px rgba(121, 209, 255, 0.25); }
  .clock .tickmarks{ opacity: .35 }

  .pomo{ margin-top:14px; border-top:1px dashed var(--border); padding-top:14px }
  .pomo-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px }
  .pomo-title{ font-weight:800 }
  .pomo-wrap{ display:grid; grid-template-columns: 160px 1fr; gap:14px }
  @media(max-width:600px){ .pomo-wrap{ grid-template-columns: 1fr } }
  .pomo-clock{ width:160px; height:160px; position:relative }
  .pomo-clock svg{ position:absolute; inset:0; transform: rotate(-90deg); }
  .pomo-center{ position:absolute; inset:0; display:grid; place-items:center; text-align:center }
  .pomo-time{ font-size:28px; font-weight:900 }
  .pomo-phase{ font-size:12px; color:var(--muted) }
  .pomo-controls{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  .pomo-controls button{ padding:8px 12px; border-radius:12px }
  .pomo-settings{ display:grid; grid-template-columns: repeat(5, 1fr); gap:8px; margin-top:8px }
  .chip{ padding:6px 10px; border:1px solid var(--border); border-radius:999px; font-weight:700 }
  .phase-work  { border-color: rgba(123,214,255,.35) }
  .phase-short { border-color: rgba(134,239,172,.35) }
  .phase-long  { border-color: rgba(169,139,255,.35) }
  .btn-finish{ border:1px solid var(--border); background: rgba(255,255,255,0.04); padding:8px 12px; border-radius:999px; font-weight:800; }
</style>
</head>
<body>

  <div class="site">
    <div class="header">
      <div class="brand">
        <div class="logo">⏱</div>
        <div>
          <h1>Study Tracker</h1>
          <p>Personal focus & progress — saved privately in your browser.</p>
        </div>
      </div>
      <div class="actions">
        <button id="themeBtn" class="toggle">🌙 Dark</button>
        <a id="exportCsv" class="btn-ghost" style="text-decoration:none; padding:10px 14px; border-radius:12px; border:1px solid var(--border)" href="javascript:void(0)">Export CSV</a>
      </div>
    </div>

    <div class="grid">
      <!-- LEFT -->
      <section class="card">
        <h3 class="section-title">Session</h3>
        <div class="row">
          <div>
            <label>Subject</label>
            <input id="subject" list="subject-list" placeholder="e.g., Algorithms, Biochem" />
            <datalist id="subject-list"></datalist>
          </div>
          <div>
            <label>Note (optional)</label>
            <input id="note" placeholder="topic / pages / tasks…" />
          </div>
        </div>

        <div class="row" style="margin-top:10px">
          <div>
            <label>Daily goal (hours)</label>
            <input id="goal" type="number" min="0" max="24" step="0.5" value="6" />
          </div>
          <div>
            <label>Session timer</label>
            <div class="controls">
              <button id="startBtn" class="btn-primary">Start</button>
              <button id="stopBtn"  class="btn-danger" disabled>Stop</button>
              <button id="resetTodayBtn" class="btn-warn">Reset today</button>
              <button id="clearAll" class="btn-ghost">Clear all</button>
            </div>
          </div>
        </div>

        <div class="big-timer">
          <div class="clock" id="bigClock">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
              <g class="tickmarks"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" /></g>
              <circle id="bigTrack" cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
              <circle id="bigCircle" cx="50" cy="50" r="42" fill="none" stroke="url(#gradSession)" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 999" stroke-dashoffset="0"/>
              <defs>
                <linearGradient id="gradSession" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%"  stop-color="#7bd6ff"/>
                  <stop offset="100%" stop-color="#a98bff"/>
                </linearGradient>
              </defs>
            </svg>
            <div class="center">
              <div id="bigClockTime" class="time">00:00:00</div>
              <div class="cap">Session</div>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="meta">
          <div class="badge">📅 Today: <span id="todayTotal">0h 0m</span></div>
          <div class="badge">🔥 Streak: <span id="streak">0 days</span></div>
          <button id="finishDayBtn" class="btn-finish">FINISH SESSION</button>
        </div>

        <p id="toast" class="toast" style="margin-top:12px"></p>

        <div class="divider"></div>
        <h3 class="section-title" style="margin-bottom:6px">Recent sessions</h3>
        <div style="max-height: 290px; overflow:auto; border-radius:12px">
          <table>
            <thead><tr>
              <th>Start</th><th>End</th><th class="right">Minutes</th><th>Subject</th><th>Note</th>
            </tr></thead>
            <tbody id="logBody">
              <tr><td colspan="5" class="empty">No sessions yet.</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- RIGHT -->
      <section class="card">
        <div class="row">
          <div class="ring-wrap">
            <h3 class="section-title" style="width:100%">Daily goal</h3>
            <div class="ring" id="ring">
              <div class="inner">
                <div style="text-align:center">
                  <div class="value" id="ringValue">0%</div>
                  <div class="cap" id="ringCap">0.0 / 6h</div>
                </div>
              </div>
            </div>
          </div>
          <div>
            <h3 class="section-title">Last 7 days</h3>
            <canvas id="chart7" height="200"></canvas>
          </div>
        </div>

        <!-- Pomodoro -->
        <div class="pomo">
          <div class="pomo-head">
            <div class="pomo-title">Pomodoro</div>
            <div id="pomoCycleInfo" class="chip phase-work">Cycle 1 • Work</div>
          </div>
          <div class="pomo-wrap">
            <div class="pomo-clock">
              <svg viewBox="0 0 100 100" aria-hidden="true">
                <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
                <circle id="pomoRing" cx="50" cy="50" r="45" fill="none" stroke="url(#gradPomo)" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 999" stroke-dashoffset="0"/>
                <defs>
                  <linearGradient id="gradPomo" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%"  stop-color="#7bd6ff"/>
                    <stop offset="100%" stop-color="#a98bff"/>
                  </linearGradient>
                </defs>
              </svg>
              <div class="pomo-center">
                <div id="pomoTime" class="pomo-time">25:00</div>
                <div id="pomoPhase" class="pomo-phase">Work</div>
              </div>
            </div>

            <div>
              <div class="pomo-controls">
                <button id="pomoStart" class="btn-primary">Start</button>
                <button id="pomoPause" class="btn-ghost" disabled>Pause</button>
                <button id="pomoSkip" class="btn-warn">Skip</button>
                <button id="pomoReset" class="btn-ghost">Reset</button>
                <label class="chip" style="display:flex;align-items:center;gap:8px">
                  <input id="pomoAuto" type="checkbox" style="accent-color:#7bd6ff"> Auto-start next
                </label>
                <label class="chip" style="display:flex;align-items:center;gap:8px">
                  <input id="pomoSound" type="checkbox" style="accent-color:#7bd6ff" checked> 🔔 Sound
                </label>
                <label class="chip" style="display:flex;align-items:center;gap:8px">
                  <input id="pomoNotify" type="checkbox" style="accent-color:#7bd6ff" checked> 🖥️ Notify
                </label>
              </div>
              <div class="pomo-settings">
                <div>
                  <label>Work (min)</label>
                  <input id="pomoWork" type="number" min="1" max="120" step="1" value="25">
                </div>
                <div>
                  <label>Short (min)</label>
                  <input id="pomoShort" type="number" min="1" max="60" step="1" value="5">
                </div>
                <div>
                  <label>Long (min)</label>
                  <input id="pomoLong" type="number" min="5" max="120" step="1" value="15">
                </div>
                <div>
                  <label>Long every</label>
                  <input id="pomoInterval" type="number" min="2" max="12" step="1" value="4">
                </div>
                <div>
                  <label>Cycle</label>
                  <input id="pomoCycleDisp" type="text" value="1" disabled>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

  </div>

<script>
/* ========================== STATE ========================== */
const LS_KEY = "study-tracker-log-v1";
const LS_SUBJECTS = "study-tracker-subjects";
const LS_GOAL = "study-tracker-goal";
const LS_THEME = "study-tracker-theme";
/* last finished local date string (YYYY-MM-DD) */
const LS_DAY_DONE = "study-tracker-day-finished";

let LOG = loadLog();
let subjectsSet = new Set(JSON.parse(localStorage.getItem(LS_SUBJECTS) || "[]"));
let session = { running:false, start:null, timerId:null };

/* ========================== UTIL ========================== */
const pad = n => String(n).padStart(2, "0");
const fmtTime = secs => `${pad(Math.floor(secs/3600))}:${pad(Math.floor((secs%3600)/60))}:${pad(secs%60)}`;
const fmtMS = secs => `${pad(Math.floor(secs/60))}:${pad(secs%60)}`;
const fmtHM = m => `${Math.floor(m/60)}h ${Math.round(m%60)}m`;
/* LOCAL date key (fixes UTC drift) */
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const human = dt => new Date(dt).toLocaleString([], {hour12:false});
const saveLog = () => localStorage.setItem(LS_KEY, JSON.stringify(LOG));
const $ = id => document.getElementById(id);

/* ========================== DOM ========================== */
const subjectEl = $("subject"), noteEl = $("note"), goalEl = $("goal");
const startBtn = $("startBtn"), stopBtn  = $("stopBtn"), resetTodayBtn = $("resetTodayBtn");
const todayTotal = $("todayTotal"), streakEl = $("streak");
const ring = $("ring"), ringValue = $("ringValue"), ringCap = $("ringCap");
const toast = $("toast"), clearAllBtn = $("clearAll"), exportCsvBtn = $("exportCsv");
const subjectList = $("subject-list");
const themeBtn = $("themeBtn");
const finishDayBtn = $("finishDayBtn");

/* BIG CLOCK DOM */
const bigClock = $("bigClock");
const bigClockTime = $("bigClockTime");
const bigCircle = $("bigCircle");
let CIRCUM = 0;

/* ========================== THEME ========================== */
const savedTheme = localStorage.getItem(LS_THEME) || "dark";
document.documentElement.setAttribute("data-theme", savedTheme);
themeBtn.textContent = savedTheme === "light" ? "🌞 Light" : (savedTheme === "pride" ? "🏳️‍🌈 Pride" : "🌙 Dark");
const THEMES = ["dark","light","pride"];
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") || "dark";
  const idx = THEMES.indexOf(cur);
  const next = THEMES[(idx+1) % THEMES.length];
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(LS_THEME, next);
  themeBtn.textContent = next === "light" ? "🌞 Light" : (next === "pride" ? "🏳️‍🌈 Pride" : "🌙 Dark");
  renderChart7();
});

/* ========================== LOADERS ========================== */
function loadLog(){
  try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]").map(r => ({...r, start:new Date(r.start), end:new Date(r.end)})); }
  catch { return []; }
}
function refreshSubjectList(){
  subjectList.innerHTML = "";
  [...subjectsSet].sort().forEach(s=>{
    const o = document.createElement("option"); o.value = s; subjectList.appendChild(o);
  });
}
goalEl.value = Number(localStorage.getItem(LS_GOAL) || goalEl.value);
goalEl.addEventListener("change", ()=>{ localStorage.setItem(LS_GOAL, goalEl.value); renderTotals(); });
refreshSubjectList();

/* ========================== CHART (7 days) ========================== */
const chart = new Chart($("chart7"), {
  type: "bar",
  data: { labels: [], datasets: [{ label: "Hours", data: [] }] },
  options: {
    responsive: true,
    scales: {
      x: { ticks: { color: getComputedStyle(document.documentElement).getPropertyValue("--muted") } },
      y: { beginAtZero: true, ticks: { color: getComputedStyle(document.documentElement).getPropertyValue("--muted") } }
    },
    plugins: { legend: { display:false } }
  }
});

/* ---- last 7 days ---- */
function lastNDaysKeys(n){
  const keys = [];
  const d = new Date(); d.setHours(0,0,0,0);
  for(let i=n-1;i>=0;i--){
    const t = new Date(d); t.setDate(d.getDate()-i);
    keys.push(dateKey(t));
  }
  return keys;
}
function weekdayShort(key){
  const [y,m,dd] = key.split("-").map(Number);
  return new Date(y, m-1, dd).toLocaleDateString([], { weekday: "short" });
}
function renderChart7(){
  const byDay = totalsByDay();
  const keys = lastNDaysKeys(7);
  chart.data.labels = keys.map(weekdayShort);
  chart.data.datasets[0].data = keys.map(k => (byDay[k] || 0) / 60);
  const muted = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim();
  chart.options.scales.x.ticks.color = muted;
  chart.options.scales.y.ticks.color = muted;
  chart.update();
}

/* ========================== RENDER ========================== */
function renderLog(){
  const body = $("logBody");
  if(LOG.length===0){ body.innerHTML = `<tr><td colspan="5" class="empty">No sessions yet.</td></tr>`; return; }
  body.innerHTML = LOG.slice().reverse().slice(0,60).map(s=>`
    <tr>
      <td>${human(s.start)}</td>
      <td>${human(s.end)}</td>
      <td class="right">${s.minutes.toFixed(2)}</td>
      <td>${s.subject || ""}</td>
      <td>${s.note || ""}</td>
    </tr>
  `).join("");
}

function totalsByDay(){
  const m = {};
  for(const s of LOG){
    const k = dateKey(new Date(s.start));
    m[k] = (m[k]||0) + s.minutes;
  }
  return m;
}

function computeStreak(){
  const byDay = totalsByDay();
  let d = new Date(); d.setHours(0,0,0,0);
  let streak = 0;
  while((byDay[dateKey(d)] || 0) > 0){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

function renderTotals(){
  const byDay = totalsByDay();
  const now = new Date(); now.setHours(0,0,0,0);
  const todayKey = dateKey(now);
  const mins = byDay[todayKey] || 0;
  todayTotal.textContent = fmtHM(mins);

  const goalH = Math.max(0, Number(goalEl.value) || 0);
  const pct = goalH > 0 ? Math.min(100, Math.round((mins/60)/goalH*100)) : 0;

  const deg = pct*3.6;
  ring.style.background = `conic-gradient(var(--accent) 0deg ${deg}deg, var(--ring-bg) ${deg}deg 360deg)`;
  ringValue.textContent = `${pct}%`;
  ringCap.textContent = `${(mins/60).toFixed(1)} / ${goalH}h`;

  const s = computeStreak();
  streakEl.textContent = `${s} ${s===1?"day":"days"}`;
  updateFinishUI();

  renderChart7();
}

function toastMsg(text){
  toast.textContent = text; toast.style.display = "block";
  setTimeout(()=> toast.style.display = "none", 2300);
}

/* ========================== BIG CLOCK ========================== */
function initBigClock(){
  const r = 42;
  CIRCUM = 2 * Math.PI * r;
  bigCircle.setAttribute("stroke-dasharray", `${CIRCUM} ${CIRCUM}`);
  bigCircle.setAttribute("stroke-dashoffset", `${CIRCUM}`);
}
function updateBigClock(secs){
  bigClockTime.textContent = fmtTime(secs);
  const s = secs % 60;
  const offset = CIRCUM - (CIRCUM * s / 60);
  bigCircle.setAttribute("stroke-dashoffset", `${offset}`);
}

/* ========================== FINISH DAY ========================== */
function getTodayKey(){ const d = new Date(); d.setHours(0,0,0,0); return dateKey(d); }
function isDayFinished(){ return localStorage.getItem(LS_DAY_DONE) === getTodayKey(); }
function clearOldFinishFlag(){
  const k = localStorage.getItem(LS_DAY_DONE);
  if (k && k !== getTodayKey()) localStorage.removeItem(LS_DAY_DONE);
}
function updateFinishUI(){
  const finished = isDayFinished();
  finishDayBtn.textContent = finished ? "RESUME TODAY" : "FINISH SESSION";
  finishDayBtn.classList.toggle("btn-warn", !finished);
  startBtn.disabled = finished || session.running;
}
finishDayBtn.addEventListener("click", () => {
  if (!isDayFinished()){
    if (session.running) { stop(); }     // ensures last block is logged
    localStorage.setItem(LS_DAY_DONE, getTodayKey());
    updateFinishUI();
    renderTotals();                       // <- immediate refresh
    toastMsg("Day finished. Amazing work! ✅");
  } else {
    localStorage.removeItem(LS_DAY_DONE());
  }
});

/* ========================== SESSION TIMER ========================== */
function tick(){
  if(!session.running) return;
  const secs = Math.floor((Date.now() - session.start)/1000);
  updateBigClock(secs);
}
function start(){
  if(isDayFinished()){
    toastMsg("You've finished today. Click “Resume today” to reopen.");
    return;
  }
  if(session.running) return;
  session.running = true; session.start = Date.now();
  session.timerId = setInterval(tick, 1000);
  updateBigClock(0);
  bigClock.classList.add("running");
  startBtn.disabled = true; stopBtn.disabled = false;
}
function stop(){
  if(!session.running) return;
  const end = Date.now(); clearInterval(session.timerId);
  session.timerId = null; session.running = false;
  bigClock.classList.remove("running");

  const minutes = Math.round(((end - session.start)/1000)/60 * 100) / 100;
  const entry = { start: new Date(session.start), end: new Date(end), minutes,
                  subject: subjectEl.value || null, note: noteEl.value || null };
  LOG.push(entry); saveLog();

  if(entry.subject){ subjectsSet.add(entry.subject);
    localStorage.setItem(LS_SUBJECTS, JSON.stringify([...subjectsSet])); refreshSubjectList(); }

  startBtn.disabled = isDayFinished();
  stopBtn.disabled = true; updateBigClock(0);
  renderLog(); renderTotals();

  const msgs = [
    "Tiny steps add up. Proud of you Kosh. 💪",
    "YAAAYYY!! You showed up Kosh — that’s the hardest part. 🌟",
    "Deep work now kiddo = future you is smiling. 😊",
    "Another brick in the wall of mastery, COME ON KOSHHHH!!. 🧱",
    "Kosh- Your consistency is your superpower. ⚡",
    "One more focused block kiddo and you cross the line. 🏁"
  ];
  toastMsg(msgs[Math.floor(Math.random()*msgs.length)]);
}
function resetToday(){
  const now = new Date(); now.setHours(0,0,0,0);
  const k = dateKey(now);
  LOG = LOG.filter(s => dateKey(new Date(s.start)) !== k);
  saveLog(); renderLog(); renderTotals();
  toastMsg("Cleared today’s entries.");
}

/* ========================== SOUND (Pomodoro) ========================== */
const Sound = {
  enabledEl: null,
  ctx: null,
  ensure() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === "suspended") this.ctx.resume();
  },
  tone(freq, dur, t0, vol=0.2, type="sine"){
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(this.ctx.destination);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.start(t0); o.stop(t0+dur);
  },
  play(endedPhase){
    if (!this.enabledEl?.checked) return;
    this.ensure();
    const now = this.ctx.currentTime;
    if (endedPhase === "work"){
      this.tone(660, 0.12, now, 0.22, "triangle");
      this.tone(880, 0.16, now+0.14, 0.22, "triangle");
    } else {
      this.tone(660, 0.12, now, 0.18, "sine");
      this.tone(523.25, 0.16, now+0.14, 0.18, "sine");
    }
  }
};

/* ========================== DESKTOP NOTIFICATIONS ========================== */
const Notifier = {
  enabledEl: null,
  async ensurePermission() {
    if (!("Notification" in window)) return false;
    if (Notification.permission === "granted") return true;
    if (Notification.permission === "denied") return false;
    try { const p = await Notification.requestPermission(); return p === "granted"; }
    catch { return false; }
  },
  async maybeAsk() {
    if (!this.enabledEl?.checked) return;
    await this.ensurePermission();
  },
  send(title, body) {
    if (!this.enabledEl?.checked) return;
    if (!("Notification" in window)) return;
    if (Notification.permission !== "granted") return;
    const n = new Notification(title, { body, silent: true });
    n.onclick = () => { window.focus(); n.close(); };
  }
};

/* ========================== POMODORO ========================== */
const P = {
  ring: $("pomoRing"),
  time: $("pomoTime"),
  phase: $("pomoPhase"),
  startBtn: $("pomoStart"),
  pauseBtn: $("pomoPause"),
  skipBtn: $("pomoSkip"),
  resetBtn: $("pomoReset"),
  work: $("pomoWork"),
  short: $("pomoShort"),
  long: $("pomoLong"),
  interval: $("pomoInterval"),
  auto: $("pomoAuto"),
  soundToggle: $("pomoSound"),
  notifyToggle: $("pomoNotify"),
  cycleDisp: $("pomoCycleDisp"),
  cycleInfo: $("pomoCycleInfo"),
  timerId: null,
  state: { phase:"work", secs: 25*60, running:false, cycle:1, total:25*60 }
};
let POMO_CIRC = 2 * Math.PI * 45;

const LS_POMO_KEY = "study-tracker-pomodoro";
function loadPomoSettings(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_POMO_KEY) || "{}");
    if(s.work) P.work.value = s.work;
    if(s.short) P.short.value = s.short;
    if(s.long) P.long.value = s.long;
    if(s.interval) P.interval.value = s.interval;
    if(typeof s.auto === "boolean") P.auto.checked = s.auto;
    if(typeof s.sound === "boolean") P.soundToggle.checked = s.sound;
    if(typeof s.notify === "boolean") P.notifyToggle.checked = s.notify;
  }catch{}
}
function savePomoSettings(){
  localStorage.setItem(LS_POMO_KEY, JSON.stringify({
    work: +P.work.value, short:+P.short.value, long:+P.long.value,
    interval:+P.interval.value, auto: P.auto.checked,
    sound: P.soundToggle.checked, notify: P.notifyToggle.checked
  }));
}
["work","short","long","interval","auto","soundToggle","notifyToggle"].forEach(k=>{
  const el = P[k]; el.addEventListener(el.type==="checkbox"?"change":"input", savePomoSettings);
});

function setPhase(phase, incCycle=false){
  const mins = phase==="work" ? +P.work.value : (phase==="short" ? +P.short.value : +P.long.value);
  P.state.phase = phase;
  P.state.total = mins*60;
  P.state.secs = mins*60;
  if(incCycle) P.state.cycle++;
  P.cycleDisp.value = P.state.cycle;
  P.cycleInfo.textContent = `Cycle ${P.state.cycle} • ${phase[0].toUpperCase()+phase.slice(1)}`;
  P.cycleInfo.className = `chip phase-${phase}`;
  P.phase.textContent = phase[0].toUpperCase()+phase.slice(1);
  updatePomoUI();
}

function updatePomoUI(){
  P.time.textContent = fmtMS(P.state.secs);
  const offset = POMO_CIRC - (POMO_CIRC * (P.state.total - P.state.secs) / P.state.total);
  P.ring.setAttribute("stroke-dasharray", `${POMO_CIRC} ${POMO_CIRC}`);
  P.ring.setAttribute("stroke-dashoffset", `${offset}`);
}

function pomoStart(){
  if(P.state.running) return;
  Sound.ensure();
  Notifier.maybeAsk();
  P.state.running = true;
  P.startBtn.disabled = true; P.pauseBtn.disabled = false;
  P.timerId = setInterval(pomoTick, 1000);
}
function pomoPause(){
  if(!P.state.running) return;
  P.state.running = false; P.startBtn.disabled = false; P.pauseBtn.disabled = true;
  clearInterval(P.timerId);
}
function pomoReset(){
  pomoPause();
  P.state.cycle = 1;
  setPhase("work");
}
function pomoSkip(){
  pomoPause(); nextPhase(true, P.state.phase);
}

function nextPhase(fromSkip=false, endedPhase=null){
  const n = +P.interval.value;
  if(P.state.phase === "work"){
    const goLong = (P.state.cycle % n === 0);
    setPhase(goLong ? "long" : "short");
  }else{
    setPhase("work", true);
  }
  if(!fromSkip){
    Sound.play(endedPhase || "work");
    const ended = endedPhase || "work";
    const goingTo = P.state.phase;
    const title = ended === "work" ? "Focus block complete 🎉" : "Break over ⏰";
    const body  = ended === "work"
      ? (goingTo === "long" ? "Long break time — recharge!" : "Short break time — stretch!")
      : "Back to work — you got this!";
    Notifier.send(title, body);
  }
  toastMsg(fromSkip ? "Skipped to next phase." : `Time! ${P.state.phase.toUpperCase()} now.`);
  if(P.auto.checked){ pomoStart(); }
}

function pomoTick(){
  if(P.state.secs > 0){ P.state.secs--; updatePomoUI(); }
  if(P.state.secs <= 0){
    const ended = P.state.phase;
    pomoPause();
    nextPhase(false, ended);
  }
}

function initPomo(){
  loadPomoSettings();
  Sound.enabledEl = P.soundToggle;
  Notifier.enabledEl = P.notifyToggle;
  P.notifyToggle.addEventListener("change", () => {
    if (P.notifyToggle.checked) Notifier.maybeAsk();
  });
  setPhase("work");
  updatePomoUI();
  P.startBtn.addEventListener("click", pomoStart);
  P.pauseBtn.addEventListener("click", pomoPause);
  P.resetBtn.addEventListener("click", pomoReset);
  P.skipBtn.addEventListener("click", pomoSkip);
}

/* ========================== BOOT ========================== */
renderLog(); renderTotals();
initBigClock();
setInterval(tick, 1000);
clearOldFinishFlag();
updateFinishUI();

startBtn.addEventListener("click", start);
stopBtn.addEventListener("click", stop);
resetTodayBtn.addEventListener("click", resetToday);
clearAllBtn.addEventListener("click", ()=>{
  if(confirm("Delete ALL saved sessions?")){ LOG=[]; saveLog(); renderLog(); renderTotals(); toastMsg("All data cleared."); }
});
exportCsvBtn.addEventListener("click", exportCsv);
initPomo();

/* ======= CSV EXPORT ======= */
function exportCsv(){
  if (!LOG.length){ toastMsg("No data to export."); return; }
  const rows = [["start","end","minutes","subject","note"]];
  for(const s of LOG){
    rows.push([new Date(s.start).toISOString(), new Date(s.end).toISOString(), s.minutes, s.subject||"", s.note||""]);
  }
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "study-tracker.csv"; a.click();
  URL.revokeObjectURL(url);
}
