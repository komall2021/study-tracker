<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Study Tracker • Focus & Flow</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<!-- CSV parser (for UCI dataset) -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
  /* =================== THEME =================== */
  :root {
    --bg: #0b0f17;
    --bg-2: radial-gradient(1200px 800px at 80% -10%, #1c2340 0%, transparent 40%),
            radial-gradient(900px 600px at -10% 20%, #162b3b 0%, transparent 45%),
            radial-gradient(1000px 600px at 50% 110%, #1e1430 0%, transparent 50%),
            #0b0f17;
    --card: rgba(23, 28, 45, 0.76);
    --border: rgba(255, 255, 255, 0.06);
    --text: #f5f7fb;
    --muted: #9db1c8;

    --primary: #7bd6ff;         /* cyan */
    --primary-2: #a98bff;       /* violet */
    --good: #86efac;
    --warn: #fbbf24;
    --danger: #fb7185;

    --ring-bg: rgba(255,255,255,0.06);
    --ring: conic-gradient(#7bd6ff, #a98bff, #7bd6ff);

    --shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
    --radius: 18px;
  }
  :root[data-theme="light"]{
    --bg: #f7f9fc;
    --bg-2: radial-gradient(1200px 800px at 80% -10%, #e8f0ff 0%, transparent 40%),
            radial-gradient(900px 600px at -10% 20%, #eaf7ff 0%, transparent 45%),
            #f7f9fc;
    --card: rgba(255,255,255,0.9);
    --border: rgba(10, 30, 50, 0.08);
    --text: #0f172a;
    --muted: #4b5563;

    --ring-bg: rgba(15,23,42,0.07);
    --shadow: 0 10px 28px rgba(15,23,42,0.08), inset 0 1px 0 rgba(255,255,255,0.5);
  }

  * { box-sizing: border-box }
  html, body { height: 100% }
  body{
    margin:0;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    color: var(--text);
    background: var(--bg-2);
    background-attachment: fixed;
    letter-spacing: 0.2px;
  }

  /* ========= LAYOUT ========= */
  .site { max-width: 1100px; margin: 28px auto; padding: 0 20px 40px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 18px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:38px; height:38px; border-radius:12px; background: linear-gradient(135deg, #7bd6ff, #a98bff); display:grid; place-items:center; color:#0b1020; font-weight:900; box-shadow: 0 8px 20px rgba(121, 209, 255, 0.25); }
  .brand h1 { font-size: 22px; margin:0; }
  .brand p { margin:0; color:var(--muted); font-size:13px }
  .actions { display:flex; gap:10px; align-items:center }
  .grid { display:grid; gap:18px; grid-template-columns: 1.1fr 1fr; }
  @media (max-width: 960px){ .grid { grid-template-columns: 1fr; } }

  /* ========= CARDS ========= */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; backdrop-filter: blur(8px); }
  .section-title{ margin: 0 0 8px 0; font-weight: 700; letter-spacing: 0.3px; }
  .divider{ height:1px; background: var(--border); margin: 12px 0 16px; }

  /* ========= FORMS & BUTTONS ========= */
  label { font-size: 12px; color: var(--muted); margin-bottom:6px; display:block }
  input { width:100%; border:1px solid var(--border); background: rgba(0,0,0,0.25); color: var(--text); border-radius: 12px; padding: 12px 14px; outline: none; transition: border-color .15s ease, transform .04s ease; }
  :root[data-theme="light"] input { background: rgba(255,255,255,0.8) }
  input:focus { border-color: #77cfff; box-shadow: 0 0 0 3px rgba(119,207,255,0.16) }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap: 12px }
  .row-3 { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px }
  @media (max-width: 560px){ .row, .row-3 { grid-template-columns: 1fr } }
  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center }
  button{ appearance:none; border:1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); font-weight: 700; letter-spacing: .2px; padding: 10px 14px; border-radius: 12px; cursor:pointer; transition: transform .04s ease, filter .15s ease, background .15s ease; }
  button:hover{ transform: translateY(-1px); filter: brightness(1.05) }
  .btn-primary{ background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #0b1020; border: none; }
  .btn-danger{ background: #2a0f15; border-color:#471e26; color:#ffd9df }
  .btn-warn  { background: #211a0b; border-color:#3b2d10; color:#fde7b0 }
  .btn-ghost { background: rgba(255,255,255,0.03) }
  .toggle{ border-radius: 999px; padding: 8px 12px; font-weight:700; background: rgba(255,255,255,0.06); }

  /* ========= BADGES ========= */
  .meta{ display:flex; gap:10px; flex-wrap:wrap }
  .badge{ display:flex; align-items:center; gap:8px; background: rgba(255,255,255,0.04); border:1px solid var(--border); border-radius: 999px; padding: 8px 12px; font-weight: 700; color: var(--text); }
  .badge .dot{ width:8px; height:8px; border-radius:999px; background: var(--primary) }

  /* ========= RING ========= */
  .ring-wrap{ display:grid; place-items:center }
  .ring{ --size: 160px; width: var(--size); height: var(--size); border-radius: 50%; background: conic-gradient(#4c5767 0deg, #4c5767 0deg, var(--ring-bg) 0deg 360deg); display:grid; place-items:center; position: relative; box-shadow: inset 0 0 0 8px rgba(0,0,0,0.15), 0 16px 30px rgba(0,0,0,0.25); }
  .ring:after{ content:""; position:absolute; inset:10px; border-radius:50%; background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,0.12), transparent 50%), linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.12)); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05); }
  .ring .inner{ position:absolute; inset:18px; border-radius:50%; display:grid; place-items:center; }
  .ring .value{ font-weight: 900; font-size: 26px }
  .ring .cap{ font-size: 12px; color: var(--muted) }

  /* ========= TABLE ========= */
  table{ width:100%; border-collapse: collapse; font-size: 13.5px }
  th, td{ padding: 10px 10px; border-bottom:1px dashed var(--border); }
  th{ text-align:left; color: var(--muted); font-weight:800; letter-spacing:.2px }
  tbody tr:hover { background: rgba(255,255,255,0.03) }
  .right{ text-align:right }
  .empty{ color: var(--muted); text-align:center; padding: 14px 0 }

  /* ========= FEEDBACK ========= */
  .toast{ border-left:4px solid var(--good); background: rgba(0, 255, 160, 0.08); padding: 12px 14px; border-radius: 12px; display:none; }

  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; animation: none !important } }
</style>
</head>
<body>

  <div class="site">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <div class="logo">⏱</div>
        <div>
          <h1>Study Tracker</h1>
          <p>Personal focus & progress — saved privately in your browser.</p>
        </div>
      </div>
      <div class="actions">
        <button id="themeBtn" class="toggle">🌙 Dark</button>
        <a id="exportCsv" class="btn-ghost" style="text-decoration:none; padding:10px 14px; border-radius:12px; border:1px solid var(--border)" href="javascript:void(0)">Export CSV</a>
      </div>
    </div>

    <div class="grid">
      <!-- LEFT: Controls & Log -->
      <section class="card">
        <h3 class="section-title">Session</h3>
        <div class="row">
          <div>
            <label>Subject</label>
            <input id="subject" list="subject-list" placeholder="e.g., Algorithms, Biochem" />
            <datalist id="subject-list"></datalist>
          </div>
          <div>
            <label>Note (optional)</label>
            <input id="note" placeholder="topic / pages / tasks…" />
          </div>
        </div>

        <div class="row" style="margin-top:10px">
          <div>
            <label>Daily goal (hours)</label>
            <input id="goal" type="number" min="0" max="24" step="0.5" value="6" />
          </div>
          <div>
            <label>Session timer</label>
            <div class="controls">
              <button id="startBtn" class="btn-primary">Start</button>
              <button id="stopBtn"  class="btn-danger" disabled>Stop</button>
              <button id="resetTodayBtn" class="btn-warn">Reset today</button>
              <button id="clearAll" class="btn-ghost">Clear all</button>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="meta">
          <div class="badge"><span class="dot"></span><span id="sessionClock">00:00:00</span></div>
          <div class="badge">📅 Today: <span id="todayTotal">0h 0m</span></div>
          <div class="badge">🔥 Streak: <span id="streak">0 days</span></div>
        </div>

        <p id="toast" class="toast" style="margin-top:12px"></p>

        <div class="divider"></div>
        <h3 class="section-title" style="margin-bottom:6px">Recent sessions</h3>
        <div style="max-height: 290px; overflow:auto; border-radius:12px">
          <table>
            <thead><tr>
              <th>Start</th><th>End</th><th class="right">Minutes</th><th>Subject</th><th>Note</th>
            </tr></thead>
            <tbody id="logBody">
              <tr><td colspan="5" class="empty">No sessions yet.</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- RIGHT: Progress -->
      <section class="card">
        <div class="row">
          <div class="ring-wrap">
            <h3 class="section-title" style="width:100%">Daily goal</h3>
            <div class="ring" id="ring">
              <div class="inner">
                <div style="text-align:center">
                  <div class="value" id="ringValue">0%</div>
                  <div class="cap" id="ringCap">0.0 / 6h</div>
                </div>
              </div>
            </div>
          </div>
          <div>
            <h3 class="section-title">Last 7 days</h3>
            <canvas id="chart7" height="200"></canvas>
          </div>
        </div>
      </section>
    </div>

    <!-- INSIGHTS (UCI dataset) -->
    <section class="card" style="margin-top:18px">
      <h3 class="section-title">Insights (UCI Student Performance)</h3>
      <div class="row">
        <div>
          <canvas id="chartStudytime" height="200"></canvas>
        </div>
        <div>
          <div id="insightsBox">Loading dataset…</div>
          <div style="margin-top:12px">
            <label>Estimate grade from weekly study hours</label>
            <div class="controls">
              <input id="hoursInput" type="number" min="0" max="40" step="0.5" value="6" style="max-width:130px">
              <button id="predictBtn" class="btn-primary">Predict</button>
            </div>
            <div id="predictOut" style="margin-top:8px;font-weight:800"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

<script>
/* ========================== STATE ========================== */
const LS_KEY = "study-tracker-log-v1";
const LS_SUBJECTS = "study-tracker-subjects";
const LS_GOAL = "study-tracker-goal";
const LS_THEME = "study-tracker-theme";

let LOG = loadLog();
let subjectsSet = new Set(JSON.parse(localStorage.getItem(LS_SUBJECTS) || "[]"));
let session = { running:false, start:null, timerId:null };

/* ========================== UTIL ========================== */
const pad = n => String(n).padStart(2, "0");
const fmtTime = secs => `${pad(Math.floor(secs/3600))}:${pad(Math.floor((secs%3600)/60))}:${pad(secs%60)}`;
const fmtHM = m => `${Math.floor(m/60)}h ${Math.round(m%60)}m`;
const dateKey = d => d.toISOString().slice(0,10);
const human = dt => new Date(dt).toLocaleString([], {hour12:false});
const saveLog = () => localStorage.setItem(LS_KEY, JSON.stringify(LOG));
const $ = id => document.getElementById(id);

/* ========================== DOM ========================== */
const subjectEl = $("subject"), noteEl = $("note"), goalEl = $("goal");
const startBtn = $("startBtn"), stopBtn  = $("stopBtn"), resetTodayBtn = $("resetTodayBtn");
const sessionClock = $("sessionClock"), todayTotal = $("todayTotal"), streakEl = $("streak");
const ring = $("ring"), ringValue = $("ringValue"), ringCap = $("ringCap");
const toast = $("toast"), clearAllBtn = $("clearAll"), exportCsvBtn = $("exportCsv");
const subjectList = $("subject-list");
const themeBtn = $("themeBtn");

/* ========================== THEME ========================== */
const savedTheme = localStorage.getItem(LS_THEME) || "dark";
document.documentElement.setAttribute("data-theme", savedTheme);
themeBtn.textContent = savedTheme === "light" ? "🌞 Light" : "🌙 Dark";
themeBtn.addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(LS_THEME, next);
  themeBtn.textContent = next === "light" ? "🌞 Light" : "🌙 Dark";
});

/* ========================== LOADERS ========================== */
function loadLog(){
  try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]").map(r => ({...r, start:new Date(r.start), end:new Date(r.end)})); }
  catch { return []; }
}
function refreshSubjectList(){
  subjectList.innerHTML = "";
  [...subjectsSet].sort().forEach(s=>{
    const o = document.createElement("option"); o.value = s; subjectList.appendChild(o);
  });
}
goalEl.value = Number(localStorage.getItem(LS_GOAL) || goalEl.value);
goalEl.addEventListener("change", ()=>{ localStorage.setItem(LS_GOAL, goalEl.value); renderTotals(); });
refreshSubjectList();

/* ========================== CHART (your last 7 days) ========================== */
let chart = new Chart($("chart7"), {
  type: "bar",
  data: { labels: [], datasets: [{ label: "Hours", data: [] }] },
  options: {
    responsive: true,
    scales: {
      x: { ticks: { color: getComputedStyle(document.documentElement).getPropertyValue("--muted") } },
      y: { beginAtZero: true, ticks: { color: getComputedStyle(document.documentElement).getPropertyValue("--muted") } }
    },
    plugins: { legend: { display:false } }
  }
});

/* ========================== RENDER ========================== */
function renderLog(){
  const body = $("logBody");
  if(LOG.length===0){ body.innerHTML = `<tr><td colspan="5" class="empty">No sessions yet.</td></tr>`; return; }
  body.innerHTML = LOG.slice().reverse().slice(0,60).map(s=>`
    <tr>
      <td>${human(s.start)}</td>
      <td>${human(s.end)}</td>
      <td class="right">${s.minutes.toFixed(2)}</td>
      <td>${s.subject || ""}</td>
      <td>${s.note || ""}</td>
    </tr>
  `).join("");
}

function totalsByDay(){
  const m = {};
  for(const s of LOG){
    const k = dateKey(new Date(s.start));
    m[k] = (m[k]||0) + s.minutes;
  }
  return m;
}

function computeStreak(){
  const byDay = totalsByDay();
  let d = new Date(); d.setHours(0,0,0,0);
  let streak = 0;
  while((byDay[dateKey(d)] || 0) > 0){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

function renderTotals(){
  const byDay = totalsByDay();
  const now = new Date(); now.setHours(0,0,0,0);
  const todayKey = dateKey(now);
  const mins = byDay[todayKey] || 0;
  todayTotal.textContent = fmtHM(mins);

  const goalH = Math.max(0, Number(goalEl.value) || 0);
  const pct = goalH > 0 ? Math.min(100, Math.round((mins/60)/goalH*100)) : 0;

  // animate ring fill
  ring.style.background = `conic-gradient(#7bd6ff 0deg ${pct*3.6}deg, var(--ring-bg) ${pct*3.6}deg 360deg)`;
  ringValue.textContent = `${pct}%`;
  ringCap.textContent = `${(mins/60).toFixed(1)} / ${goalH}h`;

  const s = computeStreak();
  streakEl.textContent = `${s} ${s===1?"day":"days"}`;

  // chart: last 7 days
  const labels = [], data = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
    const k = dateKey(d);
    labels.push(d.toLocaleDateString([], {month:"short", day:"numeric"}));
    data.push(((byDay[k]||0)/60).toFixed(2));
  }
  chart.data.labels = labels; chart.data.datasets[0].data = data; chart.update();

  // keep insights hours synced with your activity
  updateInsightsFromUser();
}

function toastMsg(text){
  toast.textContent = text; toast.style.display = "block";
  setTimeout(()=> toast.style.display = "none", 2300);
}

/* ========================== TIMER ========================== */
function tick(){
  if(!session.running) return;
  const secs = Math.floor((Date.now() - session.start)/1000);
  sessionClock.textContent = fmtTime(secs);
}
function start(){
  if(session.running) return;
  session.running = true; session.start = Date.now();
  session.timerId = setInterval(tick, 1000);
  sessionClock.textContent = "00:00:00";
  startBtn.disabled = true; stopBtn.disabled = false;
}
function stop(){
  if(!session.running) return;
  const end = Date.now(); clearInterval(session.timerId);
  session.timerId = null; session.running = false;

  const minutes = Math.round(((end - session.start)/1000)/60 * 100) / 100;
  const entry = { start: new Date(session.start), end: new Date(end), minutes,
                  subject: subjectEl.value || null, note: noteEl.value || null };
  LOG.push(entry); saveLog();

  if(entry.subject){ subjectsSet.add(entry.subject);
    localStorage.setItem(LS_SUBJECTS, JSON.stringify([...subjectsSet])); refreshSubjectList(); }

  startBtn.disabled = false; stopBtn.disabled = true; sessionClock.textContent = "00:00:00";
  renderLog(); renderTotals();

  const msgs = [
    "Tiny steps add up. Proud of you Kosh. 💪",
    "YAAAYYY!! You showed up Kosh — that’s the hardest part. 🌟",
    "Deep work now kiddo = future you is smiling. 😊",
    "Another brick in the wall of mastery, COME ON KOSHHHH!!. 🧱",
    "Kosh- Your consistency is your superpower. ⚡",
    "One more focused block kiddo and you cross the line. 🏁"
  ];
  toastMsg(msgs[Math.floor(Math.random()*msgs.length)]);
}
function resetToday(){
  const now = new Date(); now.setHours(0,0,0,0);
  const k = dateKey(now);
  LOG = LOG.filter(s => dateKey(new Date(s.start)) !== k);
  saveLog(); renderLog(); renderTotals();
  toastMsg("Cleared today’s entries.");
}

/* ========================== EXPORT & CLEAR ========================== */
function exportCsv(){
  if(LOG.length===0){ toastMsg("No data to export."); return; }
  const header = ["start","end","minutes","subject","note"];
  const rows = LOG.map(s => [new Date(s.start).toISOString(), new Date(s.end).toISOString(), s.minutes, (s.subject||""), (s.note||"")]);
  const csv = [header.join(","), ...rows.map(r => r.map(x => String(x).replaceAll('"','""')).map(x => /,|"/.test(x)?`"${x}"`:x).join(","))].join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "study_log.csv"; a.click();
  URL.revokeObjectURL(a.href);
}

/* ========================== EVENTS & INIT ========================== */
startBtn.addEventListener("click", start);
stopBtn.addEventListener("click", stop);
resetTodayBtn.addEventListener("click", resetToday);
clearAllBtn.addEventListener("click", ()=>{
  if(confirm("Delete ALL saved sessions?")){ LOG=[]; saveLog(); renderLog(); renderTotals(); toastMsg("All data cleared."); }
});
exportCsvBtn.addEventListener("click", exportCsv);

/* ========================== UCI DATA INTEGRATION ========================== */
const chartStudyEl = document.getElementById("chartStudytime");
const insightsBox   = document.getElementById("insightsBox");
const hoursInput    = document.getElementById("hoursInput");
const predictBtn    = document.getElementById("predictBtn");
const predictOut    = document.getElementById("predictOut");

let chartStudytime = null;
window._uci = null;

function sumLast7DaysMinutes(){   // use your existing log
  const byDay = totalsByDay();
  const now = new Date(); now.setHours(0,0,0,0);
  let total = 0;
  for(let i=0;i<7;i++){
    const d = new Date(now); d.setDate(now.getDate()-i);
    total += byDay[dateKey(d)] || 0;
  }
  return total;
}

function loadUCI(){
  fetch("data/student-mat.csv")
    .then(r => r.text())
    .then(csv => {
      const parsed = Papa.parse(csv, { header: true, dynamicTyping: true });
      const rows = parsed.data.filter(r => Number.isFinite(r.studytime) && Number.isFinite(r.G3));

      const labels = ["<2h", "2–5h", "5–10h", ">10h"];
      const counts = [0,0,0,0];
      const g3bins = [[],[],[],[]];
      const absPairs = [];

      for(const r of rows){
        const idx = (r.studytime|0) - 1;
        if(idx>=0 && idx<4){ counts[idx]++; g3bins[idx].push(+r.G3); }
        if(Number.isFinite(r.absences) && Number.isFinite(r.G3)){ absPairs.push([+r.absences, +r.G3]); }
      }
      const total = counts.reduce((a,b)=>a+b,0);
      const pct   = counts.map(c => +(100*c/total).toFixed(1));
      const avgG3 = g3bins.map(a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0);

      // simple regression slope: absences -> grade
      const meanX = absPairs.reduce((s,[x])=>s+x,0) / absPairs.length;
      const meanY = absPairs.reduce((s,[,y])=>s+y,0) / absPairs.length;
      let num=0, den=0;
      for(const [x,y] of absPairs){ num += (x-meanX)*(y-meanY); den += (x-meanX)*(x-meanX); }
      const slopeAbs = den ? num/den : 0;

      window._uci = { labels, pct, avgG3, meanAbs: meanX, slopeAbs, sampleSize: total };

      // draw chart
      chartStudytime = new Chart(chartStudyEl, {
        type: "bar",
        data: { labels, datasets: [{ label: "% of students", data: pct }] },
        options: { responsive:true, scales:{ y:{ beginAtZero:true } }, plugins:{ legend:{ display:false } } }
      });

      insightsBox.innerHTML = `
        <div style="line-height:1.6">
          • Dataset size: <b>${total}</b> students<br>
          • Avg final grade (G3) by study time:
          ${labels.map((l,i)=>`${l}: <b>${avgG3[i].toFixed(1)}</b>`).join("&nbsp;&nbsp;")}
          <br>• Each extra absence ≈ <b>${(-slopeAbs).toFixed(2)}</b> drop in grade (avg).
        </div>
      `;

      // seed with your last-7-days
      hoursInput.value = (sumLast7DaysMinutes()/60).toFixed(1);
    })
    .catch(err => {
      insightsBox.innerHTML = `<span style="color:#ffb4b4">Failed to load dataset.</span>`;
      console.error(err);
    });
}

predictBtn?.addEventListener("click", () => {
  if(!window._uci){ predictOut.textContent = "Dataset not loaded yet."; return; }
  const h = Number(hoursInput.value) || 0;
  const edges = [0,2,5,10,1e9];
  let level = 0;
  for(let i=0;i<4;i++){ if(h >= edges[i] && h < edges[i+1]){ level=i; break; } }
  const base = window._uci.avgG3[level] || 10;
  const pred = Math.max(0, Math.min(20, base));
  predictOut.textContent = `Estimated final grade (G3) ≈ ${pred.toFixed(1)} / 20 based on ~${h}h/week`;
});

// keep estimator synced with your new logs
function updateInsightsFromUser(){
  if(!window._uci) return;
  hoursInput.value = (sumLast7DaysMinutes()/60).toFixed(1);
}

/* ========================== BOOT ========================== */
renderLog(); renderTotals(); setInterval(tick, 1000);
loadUCI();  // <-- load dataset
</script>
</body>
</html>
