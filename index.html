<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Study Tracker • Focus & Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  /* [UNCHANGED STYLES OMITTED FOR BREVITY — your CSS is intact] */

<body>
  <!-- [UNCHANGED MARKUP OMITTED — your HTML is intact] -->
<script>
/* ========================== STATE ========================== */
const LS_KEY = "study-tracker-log-v1";
const LS_SUBJECTS = "study-tracker-subjects";
const LS_GOAL = "study-tracker-goal";
const LS_THEME = "study-tracker-theme";
const LS_DAY_DONE = "study-tracker-day-finished";

let LOG = loadLog();
let subjectsSet = new Set(JSON.parse(localStorage.getItem(LS_SUBJECTS) || "[]"));
let session = { running:false, start:null, timerId:null };

/* ========================== UTIL ========================== */
const pad = n => String(n).padStart(2, "0");
const fmtTime = secs => `${pad(Math.floor(secs/3600))}:${pad(Math.floor((secs%3600)/60))}:${pad(secs%60)}`;
const fmtMS = secs => `${pad(Math.floor(secs/60))}:${pad(secs%60)}`;
const fmtHM = m => `${Math.floor(m/60)}h ${Math.round(m%60)}m`;
const dateKey = d => d.toISOString().slice(0,10);
const human = dt => new Date(dt).toLocaleString([], {hour12:false});
const saveLog = () => localStorage.setItem(LS_KEY, JSON.stringify(LOG));
const $ = id => document.getElementById(id);

/* ========================== DOM ========================== */
const subjectEl = $("subject"), noteEl = $("note"), goalEl = $("goal");
const startBtn = $("startBtn"), stopBtn  = $("stopBtn"), resetTodayBtn = $("resetTodayBtn");
const todayTotal = $("todayTotal"), streakEl = $("streak");
const ring = $("ring"), ringValue = $("ringValue"), ringCap = $("ringCap");
const toast = $("toast"), clearAllBtn = $("clearAll"), exportCsvBtn = $("exportCsv");
const subjectList = $("subject-list");
const themeBtn = $("themeBtn");
const finishDayBtn = $("finishDayBtn");

/* BIG CLOCK DOM */
const bigClock = $("bigClock");
const bigClockTime = $("bigClockTime");
const bigCircle = $("bigCircle");
let CIRCUM = 0;

/* ========================== THEME ========================== */
const savedTheme = localStorage.getItem(LS_THEME) || "dark";
document.documentElement.setAttribute("data-theme", savedTheme);
themeBtn.textContent = savedTheme === "light" ? "🌞 Light" : (savedTheme === "pride" ? "🏳️‍🌈 Pride" : "🌙 Dark");
const THEMES = ["dark","light","pride"];
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") || "dark";
  const idx = THEMES.indexOf(cur);
  const next = THEMES[(idx+1) % THEMES.length];
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(LS_THEME, next);
  themeBtn.textContent = next === "light" ? "🌞 Light" : (next === "pride" ? "🏳️‍🌈 Pride" : "🌙 Dark");
  renderChart7();
});

/* ========================== LOADERS ========================== */
function loadLog(){
  try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]").map(r => ({...r, start:new Date(r.start), end:new Date(r.end)})); }
  catch { return []; }
}
function refreshSubjectList(){
  subjectList.innerHTML = "";
  [...subjectsSet].sort().forEach(s=>{
    const o = document.createElement("option"); o.value = s; subjectList.appendChild(o);
  });
}
goalEl.value = Number(localStorage.getItem(LS_GOAL) || goalEl.value);
goalEl.addEventListener("change", ()=>{ localStorage.setItem(LS_GOAL, goalEl.value); renderTotals(); });
refreshSubjectList();

/* ========================== CHART (7 days) ========================== */
const chart = new Chart($("chart7"), {
  type: "bar",
  data: { labels: [], datasets: [{ label: "Hours", data: [] }] },
  options: {
    responsive: true,
    scales: {
      x: { ticks: { color: getComputedStyle(document.documentElement).getPropertyValue("--muted") } },
      y: { beginAtZero: true, ticks: { color: getComputedStyle(document.documentElement).getPropertyValue("--muted") } }
    },
    plugins: { legend: { display:false } }
  }
});

/* ---- NEW: compute + render last 7 days ---- */
function lastNDaysKeys(n){
  const keys = [];
  const d = new Date();
  d.setHours(0,0,0,0);
  for(let i=n-1;i>=0;i--){
    const t = new Date(d);
    t.setDate(d.getDate()-i);
    keys.push(dateKey(t));
  }
  return keys;
}
function weekdayShort(key){
  const [y,m,dd] = key.split("-").map(Number);
  const d = new Date(y, m-1, dd);
  return d.toLocaleDateString([], { weekday: "short" });
}
function renderChart7(){
  const byDay = totalsByDay();
  const keys = lastNDaysKeys(7);
  const labels = keys.map(k => weekdayShort(k));
  const hours = keys.map(k => (byDay[k] || 0) / 60);
  const muted = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim();
  chart.data.labels = labels;
  chart.data.datasets[0].data = hours;
  chart.options.scales.x.ticks.color = muted;
  chart.options.scales.y.ticks.color = muted;
  chart.update();
}

/* ========================== RENDER ========================== */
function renderLog(){
  const body = $("logBody");
  if(LOG.length===0){ body.innerHTML = `<tr><td colspan="5" class="empty">No sessions yet.</td></tr>`; return; }
  body.innerHTML = LOG.slice().reverse().slice(0,60).map(s=>`
    <tr>
      <td>${human(s.start)}</td>
      <td>${human(s.end)}</td>
      <td class="right">${s.minutes.toFixed(2)}</td>
      <td>${s.subject || ""}</td>
      <td>${s.note || ""}</td>
    </tr>
  `).join("");
}

function totalsByDay(){
  const m = {};
  for(const s of LOG){
    const k = dateKey(new Date(s.start));
    m[k] = (m[k]||0) + s.minutes;
  }
  return m;
}

function computeStreak(){
  const byDay = totalsByDay();
  let d = new Date(); d.setHours(0,0,0,0);
  let streak = 0;
  while((byDay[dateKey(d)] || 0) > 0){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

function renderTotals(){
  const byDay = totalsByDay();
  const now = new Date(); now.setHours(0,0,0,0);
  const todayKey = dateKey(now);
  const mins = byDay[todayKey] || 0;
  todayTotal.textContent = fmtHM(mins);

  const goalH = Math.max(0, Number(goalEl.value) || 0);
  const pct = goalH > 0 ? Math.min(100, Math.round((mins/60)/goalH*100)) : 0;

  const deg = pct*3.6;
  ring.style.background = `conic-gradient(var(--accent) 0deg ${deg}deg, var(--ring-bg) ${deg}deg 360deg)`;
  ringValue.textContent = `${pct}%`;
  ringCap.textContent = `${(mins/60).toFixed(1)} / ${goalH}h`;

  const s = computeStreak();
  streakEl.textContent = `${s} ${s===1?"day":"days"}`;
  updateFinishUI();

  renderChart7();
}

function toastMsg(text){
  toast.textContent = text; toast.style.display = "block";
  setTimeout(()=> toast.style.display = "none", 2300);
}

/* ========================== BIG CLOCK ========================== */
function initBigClock(){
  const r = 42;
  CIRCUM = 2 * Math.PI * r;
  bigCircle.setAttribute("stroke-dasharray", `${CIRCUM} ${CIRCUM}`);
  bigCircle.setAttribute("stroke-dashoffset", `${CIRCUM}`);
}
function updateBigClock(secs){
  bigClockTime.textContent = fmtTime(secs);
  const s = secs % 60;
  const offset = CIRCUM - (CIRCUM * s / 60);
  bigCircle.setAttribute("stroke-dashoffset", `${offset}`);
}

/* ========================== FINISH DAY ========================== */
function getTodayKey(){ const d = new Date(); d.setHours(0,0,0,0); return dateKey(d); }
function isDayFinished(){
  const k = localStorage.getItem(LS_DAY_DONE);
  return k === getTodayKey();
}
function clearOldFinishFlag(){
  const k = localStorage.getItem(LS_DAY_DONE);
  if (k && k !== getTodayKey()) localStorage.removeItem(LS_DAY_DONE);
}
function updateFinishUI(){
  const finished = isDayFinished();
  finishDayBtn.textContent = finished ? "RESUME TODAY" : "FINISH SESSION";
  finishDayBtn.classList.toggle("btn-warn", !finished);
  startBtn.disabled = finished || session.running;
}
finishDayBtn.addEventListener("click", () => {
  if (!isDayFinished()){
    if (session.running) { stop(); } // ensures the split write happens immediately
    localStorage.setItem(LS_DAY_DONE, getTodayKey());
    updateFinishUI();
    toastMsg("Day finished. Amazing work! ✅");
  } else {
    localStorage.removeItem(LS_DAY_DONE);
    updateFinishUI();
    toastMsg("You can log more sessions today.");
  }
});

/* ========================== SESSION TIMER ========================== */
function tick(){
  if(!session.running) return;
  const secs = Math.floor((Date.now() - session.start)/1000);
  updateBigClock(secs);
}
function start(){
  if(isDayFinished()){
    toastMsg("You've finished today. Click “Resume today” to reopen.");
    return;
  }
  if(session.running) return;
  session.running = true; session.start = Date.now();
  session.timerId = setInterval(tick, 1000);
  updateBigClock(0);
  bigClock.classList.add("running");
  startBtn.disabled = true; stopBtn.disabled = false;
}

/* ---- NEW: split sessions that cross midnight ---- */
/* why: ensure minutes are credited to the correct calendar day */
function midnightAfter(d){
  const x = new Date(d);
  x.setHours(24,0,0,0); // next midnight
  return x;
}
function pushEntry(startMs, endMs, subject, note){
  const minutes = Math.round(((endMs - startMs)/60000) * 100) / 100;
  if (minutes <= 0) return; // guard tiny/negative
  LOG.push({
    start: new Date(startMs),
    end:   new Date(endMs),
    minutes,
    subject: subject || null,
    note: note || null
  });
}
function logSessionSplit(startMs, endMs, subject, note){
  let s = startMs, e = endMs;
  while (true){
    const nextMid = +midnightAfter(new Date(s));
    const segEnd = Math.min(e, nextMid);
    pushEntry(s, segEnd, subject, note);
    if (segEnd >= e) break;
    s = nextMid; // continue with next day
  }
}

function stop(){
  if(!session.running) return;
  const end = Date.now(); clearInterval(session.timerId);
  session.timerId = null; session.running = false;
  bigClock.classList.remove("running");

  const subject = subjectEl.value;
  const note = noteEl.value;
  logSessionSplit(session.start, end, subject, note);
  saveLog();

  if(subject){ subjectsSet.add(subject);
    localStorage.setItem(LS_SUBJECTS, JSON.stringify([...subjectsSet])); refreshSubjectList(); }

  startBtn.disabled = isDayFinished() ? true : false;
  stopBtn.disabled = true; updateBigClock(0);
  renderLog(); renderTotals();

  const msgs = [
    "Tiny steps add up. Proud of you Kosh. 💪",
    "YAAAYYY!! You showed up Kosh — that’s the hardest part. 🌟",
    "Deep work now kiddo = future you is smiling. 😊",
    "Another brick in the wall of mastery, COME ON KOSHHHH!!. 🧱",
    "Kosh- Your consistency is your superpower. ⚡",
    "One more focused block kiddo and you cross the line. 🏁"
  ];
  toastMsg(msgs[Math.floor(Math.random()*msgs.length)]);
}
function resetToday(){
  const now = new Date(); now.setHours(0,0,0,0);
  const k = dateKey(now);
  LOG = LOG.filter(s => dateKey(new Date(s.start)) !== k);
  saveLog(); renderLog(); renderTotals();
  toastMsg("Cleared today’s entries.");
}

/* ========================== SOUND (Pomodoro) ========================== */
const Sound = {
  enabledEl: null,
  ctx: null,
  ensure() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === "suspended") this.ctx.resume();
  },
  tone(freq, dur, t0, vol=0.2, type="sine"){
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(this.ctx.destination);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.start(t0); o.stop(t0+dur);
  },
  play(endedPhase){
    if (!this.enabledEl?.checked) return;
    this.ensure();
    const now = this.ctx.currentTime;
    if (endedPhase === "work"){
      this.tone(660, 0.12, now, 0.22, "triangle");
      this.tone(880, 0.16, now+0.14, 0.22, "triangle");
    } else {
      this.tone(660, 0.12, now, 0.18, "sine");
      this.tone(523.25, 0.16, now+0.14, 0.18, "sine");
    }
  }
};

/* ========================== DESKTOP NOTIFICATIONS ========================== */
const Notifier = {
  enabledEl: null,
  async ensurePermission() {
    if (!("Notification" in window)) return false;
    if (Notification.permission === "granted") return true;
    if (Notification.permission === "denied") return false;
    try { const p = await Notification.requestPermission(); return p === "granted"; }
    catch { return false; }
  },
  async maybeAsk() {
    if (!this.enabledEl?.checked) return;
    await this.ensurePermission();
  },
  send(title, body) {
    if (!this.enabledEl?.checked) return;
    if (!("Notification" in window)) return;
    if (Notification.permission !== "granted") return;
    const n = new Notification(title, { body, silent: true });
    n.onclick = () => { window.focus(); n.close(); };
  }
};

/* ========================== POMODORO ========================== */
const P = {
  ring: $("pomoRing"),
  time: $("pomoTime"),
  phase: $("pomoPhase"),
  startBtn: $("pomoStart"),
  pauseBtn: $("pomoPause"),
  skipBtn: $("pomoSkip"),
  resetBtn: $("pomoReset"),
  work: $("pomoWork"),
  short: $("pomoShort"),
  long: $("pomoLong"),
  interval: $("pomoInterval"),
  auto: $("pomoAuto"),
  soundToggle: $("pomoSound"),
  notifyToggle: $("pomoNotify"),
  cycleDisp: $("pomoCycleDisp"),
  cycleInfo: $("pomoCycleInfo"),
  timerId: null,
  state: { phase:"work", secs: 25*60, running:false, cycle:1, total:25*60 }
};
let POMO_CIRC = 2 * Math.PI * 45;

const LS_POMO_KEY = "study-tracker-pomodoro";
function loadPomoSettings(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_POMO_KEY) || "{}");
    if(s.work) P.work.value = s.work;
    if(s.short) P.short.value = s.short;
    if(s.long) P.long.value = s.long;
    if(s.interval) P.interval.value = s.interval;
    if(typeof s.auto === "boolean") P.auto.checked = s.auto;
    if(typeof s.sound === "boolean") P.soundToggle.checked = s.sound;
    if(typeof s.notify === "boolean") P.notifyToggle.checked = s.notify;
  }catch{}
}
function savePomoSettings(){
  localStorage.setItem(LS_POMO_KEY, JSON.stringify({
    work: +P.work.value, short:+P.short.value, long:+P.long.value,
    interval:+P.interval.value, auto: P.auto.checked,
    sound: P.soundToggle.checked, notify: P.notifyToggle.checked
  }));
}
["work","short","long","interval","auto","soundToggle","notifyToggle"].forEach(k=>{
  const el = P[k]; el.addEventListener(el.type==="checkbox"?"change":"input", savePomoSettings);
});

function setPhase(phase, incCycle=false){
  const mins = phase==="work" ? +P.work.value : (phase==="short" ? +P.short.value : +P.long.value);
  P.state.phase = phase;
  P.state.total = mins*60;
  P.state.secs = mins*60;
  if(incCycle) P.state.cycle++;
  P.cycleDisp.value = P.state.cycle;
  P.cycleInfo.textContent = `Cycle ${P.state.cycle} • ${phase[0].toUpperCase()+phase.slice(1)}`;
  P.cycleInfo.className = `chip phase-${phase}`;
  P.phase.textContent = phase[0].toUpperCase()+phase.slice(1);
  updatePomoUI();
}

function updatePomoUI(){
  P.time.textContent = fmtMS(P.state.secs);
  const offset = POMO_CIRC - (POMO_CIRC * (P.state.total - P.state.secs) / P.state.total);
  P.ring.setAttribute("stroke-dasharray", `${POMO_CIRC} ${POMO_CIRC}`);
  P.ring.setAttribute("stroke-dashoffset", `${offset}`);
}

function pomoStart(){
  if(P.state.running) return;
  Sound.ensure();
  Notifier.maybeAsk();
  P.state.running = true;
  P.startBtn.disabled = true; P.pauseBtn.disabled = false;
  P.timerId = setInterval(pomoTick, 1000);
}
function pomoPause(){
  if(!P.state.running) return;
  P.state.running = false; P.startBtn.disabled = false; P.pauseBtn.disabled = true;
  clearInterval(P.timerId);
}
function pomoReset(){
  pomoPause();
  P.state.cycle = 1;
  setPhase("work");
}
function pomoSkip(){
  pomoPause(); nextPhase(true, P.state.phase);
}

function nextPhase(fromSkip=false, endedPhase=null){
  const n = +P.interval.value;
  if(P.state.phase === "work"){
    const goLong = (P.state.cycle % n === 0);
    setPhase(goLong ? "long" : "short");
  }else{
    setPhase("work", true);
  }
  if(!fromSkip){
    Sound.play(endedPhase || "work");
    const ended = endedPhase || "work";
    const goingTo = P.state.phase;
    const title = ended === "work" ? "Focus block complete 🎉" : "Break over ⏰";
    const body  = ended === "work"
      ? (goingTo === "long" ? "Long break time — recharge!" : "Short break time — stretch!")
      : "Back to work — you got this!";
    Notifier.send(title, body);
  }
  toastMsg(fromSkip ? "Skipped to next phase." : `Time! ${P.state.phase.toUpperCase()} now.`);
  if(P.auto.checked){ pomoStart(); }
}

function pomoTick(){
  if(P.state.secs > 0){ P.state.secs--; updatePomoUI(); }
  if(P.state.secs <= 0){
    const ended = P.state.phase;
    pomoPause();
    nextPhase(false, ended);
  }
}

function initPomo(){
  loadPomoSettings();
  Sound.enabledEl = P.soundToggle;
  Notifier.enabledEl = P.notifyToggle;
  P.notifyToggle.addEventListener("change", () => {
    if (P.notifyToggle.checked) Notifier.maybeAsk();
  });
  setPhase("work");
  updatePomoUI();
  P.startBtn.addEventListener("click", pomoStart);
  P.pauseBtn.addEventListener("click", pomoPause);
  P.resetBtn.addEventListener("click", pomoReset);
  P.skipBtn.addEventListener("click", pomoSkip);
}

/* ========================== BOOT ========================== */
renderLog(); renderTotals();
initBigClock();
setInterval(tick, 1000);
clearOldFinishFlag();
updateFinishUI();

startBtn.addEventListener("click", start);
stopBtn.addEventListener("click", stop);
resetTodayBtn.addEventListener("click", resetToday);
clearAllBtn.addEventListener("click", ()=>{
  if(confirm("Delete ALL saved sessions?")){ LOG=[]; saveLog(); renderLog(); renderTotals(); toastMsg("All data cleared."); }
});
exportCsvBtn.addEventListener("click", exportCsv);

initPomo();

/* ======= CSV EXPORT ======= */
function exportCsv(){
  if (!LOG.length){ toastMsg("No data to export."); return; }
  const rows = [["start","end","minutes","subject","note"]];
  for(const s of LOG){
    rows.push([s.start.toISOString(), s.end.toISOString(), s.minutes, s.subject||"", s.note||""]);
  }
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "study-tracker.csv"; a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
